<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - RAKSHAK</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        nav {
            background: #c62828;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd54f;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #c62828;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c62828;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #8e0000;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
        }

        .register-text a {
            color: #c62828;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 100px;
        }

        @media (max-width: 768px) {

            nav {
                justify-content: center;
                gap: 15px;
            }

            .nav-links {
                justify-content: center;
                gap: 12px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVIGATION ================= -->

<nav>

    <div class="logo">
        🚑 RAKSHAK
    </div>

    <ul class="nav-links">

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/about.html">About</a>
        </li>

        <li>
            <a href="/report">Report</a>
        </li>

        <li>
            <a href="/hospital.html">Hospital</a>
        </li>

        <li>
            <a href="/police">Police</a>
        </li>

        <li>
            <a href="/emergency.html">Emergency</a>
        </li>

        <li>
            <a href="/contact.html">Contact</a>
        </li>

        <li>
            <a href="/login.html">Login</a>
        </li>

    </ul>

</nav>


<!-- ================= LOGIN ================= -->

<div class="container">

    <div class="card">

        <h1>
            🔐 RAKSHAK Login
        </h1>


        <form action="/login-user" method="POST">


            <!-- EMAIL -->

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn"
            >
                Login
            </button>


        </form>


        <div class="register-text">

            Don't have an account?

            <a href="/register.html">
                Create Account
            </a>

        </div>

    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer>

    © 2026 RAKSHAK - Road Accident Emergency Portal

</footer>


</body>

</html>
