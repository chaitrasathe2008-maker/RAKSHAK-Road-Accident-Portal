<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAKSHAK - Blood Donor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        nav {
            background: #c62828;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd54f;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #c62828;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #8e0000;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            🚑 RAKSHAK
        </div>

        <ul class="nav-links">

            <li><a href="/">Home</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/report">Report</a></li>
            <li><a href="/hospital.html">Hospital</a></li>
            <li><a href="/police">Police</a></li>
            <li><a href="/emergency.html">Emergency</a></li>
            <li><a href="/blood-donor">🩸 Blood Donor</a></li>
            <li><a href="/contact.html">Contact</a></li>

        </ul>

    </nav>


    <div class="container">

        <div class="card">

            <h1>🩸 Emergency Blood Donor</h1>

            <p class="subtitle">
                Register as a blood donor and help during emergencies.
            </p>


            <form action="/register-donor" method="POST">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>Mobile Number</label>

                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter mobile number"
                    required
                >


                <label>Blood Group</label>

                <select name="blood_group" required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label>City</label>

                <input
                    type="text"
                    name="city"
                    placeholder="Enter your city"
                    required
                >


                <button type="submit" class="btn">
                    🩸 Register as Blood Donor
                </button>

            </form>

        </div>

    </div>


    <footer>

        © 2026 RAKSHAK - Road Accident Emergency Portal

    </footer>

</body>

</html>
