<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAKSHAK - Hospitals</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #c62828;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        nav h2 {
            margin: 0;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd54f;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            color: #c62828;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .find-box {
            text-align: center;
            margin: 25px 0;
        }

        .find-btn {
            padding: 15px 25px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .find-btn:hover {
            background: #0d47a1;
        }

        #hospitalStatus {
            margin-top: 15px;
            font-weight: bold;
        }

        .hospital-list {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .hospital-card {
            background: white;
            width: 280px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        .hospital-card:hover {
            transform: translateY(-5px);
        }

        .hospital-card h2 {
            color: #c62828;
            margin-bottom: 15px;
        }

        .hospital-card p {
            color: #555;
            line-height: 1.6;
        }

        .emergency {
            color: green !important;
            font-weight: bold;
        }

        .buttons {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .call-btn,
        .map-btn {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .call-btn {
            background: #c62828;
        }

        .call-btn:hover {
            background: #8e0000;
        }

        .map-btn {
            background: #1565c0;
        }

        .map-btn:hover {
            background: #0d47a1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <h2>🚑 RAKSHAK</h2>

        <div class="nav-links">

            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/report">Report</a>
            <a href="/hospital.html">Hospital</a>
            <a href="/police">Police</a>
            <a href="/emergency.html">Emergency</a>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container">

        <h1>🏥 Emergency Hospitals</h1>

        <p class="subtitle">
            Find hospitals near your current location.
        </p>

        <div class="find-box">

            <button
                onclick="findNearbyHospitals()"
                class="find-btn">

                📍 Find Nearby Hospitals

            </button>

            <p id="hospitalStatus"></p>

        </div>


        <!-- HOSPITAL RESULTS -->

        <div
            class="hospital-list"
            id="hospitalList">

        </div>


        <a href="/dashboard" class="back">
            🏠 Back to Dashboard
        </a>

    </div>


    <!-- FOOTER -->

    <footer>
        © 2026 RAKSHAK - Road Accident Emergency Portal
    </footer>


    <!-- JAVASCRIPT -->

    <script>

        async function findNearbyHospitals() {

            const status =
                document.getElementById("hospitalStatus");

            const hospitalList =
                document.getElementById("hospitalList");


            status.innerHTML =
                "📍 Detecting your current location...";

            hospitalList.innerHTML = "";


            // Check browser support

            if (!navigator.geolocation) {

                status.innerHTML =
                    "❌ Your browser does not support location.";

                return;
            }


            // Get CURRENT location

            navigator.geolocation.getCurrentPosition(

                async function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    console.log(
                        "CURRENT LOCATION:",
                        latitude,
                        longitude
                    );


                    status.innerHTML =
                        "🔍 Searching hospitals near your location...";


                    /*
                        Search radius = 10 KM
                    */

                    const radius = 10000;


                    /*
                        Overpass API query

                        IMPORTANT:
                        latitude and longitude are taken
                        from the user's CURRENT location.
                    */

                    const query = `
                        [out:json][timeout:25];

                        (
                            node["amenity"="hospital"]
                            (around:${radius},${latitude},${longitude});

                            way["amenity"="hospital"]
                            (around:${radius},${latitude},${longitude});

                            relation["amenity"="hospital"]
                            (around:${radius},${latitude},${longitude});
                        );

                        out center;
                    `;


                    try {

                        const response =
                            await fetch(
                                "https://overpass-api.de/api/interpreter",
                                {
                                    method: "POST",
                                    body: query
                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Hospital API failed"
                            );

                        }


                        const data =
                            await response.json();


                        const hospitals =
                            data.elements;


                        if (!hospitals.length) {

                            status.innerHTML =
                                "❌ No hospitals found within 10 km.";

                            return;
                        }


                        /*
                            Calculate distance
                        */

                        function getDistance(
                            lat1,
                            lon1,
                            lat2,
                            lon2
                        ) {

                            const R = 6371;

                            const dLat =
                                (lat2 - lat1) *
                                Math.PI / 180;

                            const dLon =
                                (lon2 - lon1) *
                                Math.PI / 180;


                            const a =
                                Math.sin(dLat / 2) ** 2 +

                                Math.cos(
                                    lat1 * Math.PI / 180
                                ) *

                                Math.cos(
                                    lat2 * Math.PI / 180
                                ) *

                                Math.sin(dLon / 2) ** 2;


                            const c =
                                2 *
                                Math.atan2(
                                    Math.sqrt(a),
                                    Math.sqrt(1 - a)
                                );


                            return R * c;
                        }


                        /*
                            Create hospital data
                        */

                        const hospitalData =
                            hospitals
                                .map(hospital => {

                                    const lat =
                                        hospital.lat ??
                                        hospital.center?.lat;

                                    const lon =
                                        hospital.lon ??
                                        hospital.center?.lon;


                                    if (
                                        lat === undefined ||
                                        lon === undefined
                                    ) {

                                        return null;
                                    }


                                    const name =
                                        hospital.tags?.name ||
                                        "Unnamed Hospital";


                                    const distance =
                                        getDistance(
                                            latitude,
                                            longitude,
                                            lat,
                                            lon
                                        );


                                    const phone =
                                        hospital.tags?.phone ||
                                        hospital.tags?.["contact:phone"] ||
                                        "";


                                    return {

                                        name: name,

                                        lat: lat,

                                        lon: lon,

                                        distance: distance,

                                        phone: phone

                                    };

                                })

                                .filter(
                                    hospital =>
                                        hospital !== null
                                );


                        /*
                            Sort nearest first
                        */

                        hospitalData.sort(
                            (a, b) =>
                                a.distance -
                                b.distance
                        );


                        /*
                            Show nearest 5
                        */

                        const nearest =
                            hospitalData.slice(0, 5);


                        /*
                            Display results
                        */

                        nearest.forEach(
                            hospital => {

                                const card =
                                    document.createElement(
                                        "div"
                                    );


                                card.className =
                                    "hospital-card";


                                /*
                                    Google Maps Directions
                                    FROM CURRENT LOCATION
                                    TO HOSPITAL
                                */

                                const mapUrl =
                                    "https://www.google.com/maps/dir/?api=1" +
                                    "&origin=" +
                                    latitude +
                                    "," +
                                    longitude +
                                    "&destination=" +
                                    hospital.lat +
                                    "," +
                                    hospital.lon;


                                let phoneButton = "";


                                if (hospital.phone) {

                                    phoneButton = `
                                        <a
                                            href="tel:${hospital.phone}"
                                            class="call-btn">

                                            📞 Call

                                        </a>
                                    `;

                                }


                                card.innerHTML = `

                                    <h2>
                                        🏥 ${hospital.name}
                                    </h2>

                                    <p>
                                        📍
                                        ${hospital.distance.toFixed(2)}
                                        km away
                                    </p>

                                    <p class="emergency">
                                        🚑 Nearby Hospital
                                    </p>

                                    <div class="buttons">

                                        ${phoneButton}

                                        <a
                                            href="${mapUrl}"
                                            target="_blank"
                                            class="map-btn">

                                            📍 Directions

                                        </a>

                                    </div>

                                `;


                                hospitalList.appendChild(
                                    card
                                );

                            }
                        );


                        status.innerHTML =
                            `✅ Found ${nearest.length} nearby hospitals within 10 km.`;


                    }

                    catch (error) {

                        console.error(error);

                        status.innerHTML =
                            "❌ Unable to find nearby hospitals. Please try again.";

                    }

                },


                /*
                    LOCATION ERROR
                */

                function(error) {

                    if (error.code === 1) {

                        status.innerHTML =
                            "❌ Location permission denied. Please allow location access.";

                    }

                    else if (error.code === 2) {

                        status.innerHTML =
                            "❌ Your location could not be determined.";

                    }

                    else if (error.code === 3) {

                        status.innerHTML =
                            "⏳ Location request timed out. Try again.";

                    }

                    else {

                        status.innerHTML =
                            "❌ Unable to detect your current location.";

                    }

                },


                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }

            );

        }

    </script>

</body>

</html>
