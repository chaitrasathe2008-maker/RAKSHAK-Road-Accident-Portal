<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAKSHAK - Nearby Hospitals</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #c62828;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
        }

        nav h2 {
            margin: 0;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        h1 {
            text-align: center;
            color: #c62828;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        .find-box {
            text-align: center;
            margin: 30px 0;
        }

        .find-btn {
            padding: 15px 25px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .find-btn:hover {
            background: #0d47a1;
        }

        #hospitalStatus {
            margin-top: 15px;
            font-weight: bold;
        }

        .hospital-list {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .hospital-card {
            background: white;
            width: 300px;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .hospital-card h2 {
            color: #c62828;
            font-size: 20px;
        }

        .hospital-card p {
            color: #555;
            line-height: 1.6;
        }

        .buttons {
            margin-top: 18px;
        }

        .map-btn {
            display: inline-block;

            padding: 10px 15px;

            background: #1565c0;
            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;
        }

        .map-btn:hover {
            background: #0d47a1;
        }

        footer {
            margin-top: 50px;

            background: #222;
            color: white;

            text-align: center;

            padding: 20px;
        }

    </style>

</head>


<body>


<nav>

    <h2>🚑 RAKSHAK</h2>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/report">
            Report
        </a>

        <a href="/police">
            Police
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<div class="container">

    <h1>
        🏥 Nearby Emergency Hospitals
    </h1>

    <p class="subtitle">
        Find hospitals near your current location.
    </p>


    <div class="find-box">

        <button
            type="button"
            class="find-btn"
            onclick="findNearbyHospitals()">

            📍 Find Nearby Hospitals

        </button>

        <p id="hospitalStatus"></p>

    </div>


    <div
        class="hospital-list"
        id="hospitalList">

        <div class="hospital-card">

            <h2>
                🏥 Find Nearby Hospitals
            </h2>

            <p>
                Click the button to find hospitals
                near your current location.
            </p>

        </div>

    </div>


</div>


<footer>

    © 2026 RAKSHAK -
    Road Accident Emergency Portal

</footer>



<script>


function findNearbyHospitals() {

    const status =
        document.getElementById("hospitalStatus");

    const hospitalList =
        document.getElementById("hospitalList");


    status.innerHTML =
        "📍 Getting your current location...";


    if (!navigator.geolocation) {

        status.innerHTML =
            "❌ Your browser does not support location.";

        return;

    }


    /*
     FIRST LOCATION ATTEMPT
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            console.log(
                "Latitude:",
                latitude
            );

            console.log(
                "Longitude:",
                longitude
            );


            status.innerHTML =
                "🔍 Searching nearby hospitals...";


            searchHospitals(
                latitude,
                longitude
            );

        },


        function(error) {

            console.log(
                "First location attempt failed:",
                error
            );


            /*
             SECOND ATTEMPT
            */

            status.innerHTML =
                "📍 Trying to get location again...";


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    console.log(
                        "Second Latitude:",
                        latitude
                    );

                    console.log(
                        "Second Longitude:",
                        longitude
                    );


                    status.innerHTML =
                        "🔍 Searching nearby hospitals...";


                    searchHospitals(
                        latitude,
                        longitude
                    );

                },


                function(secondError) {

                    console.error(
                        "Location failed:",
                        secondError
                    );


                    if (secondError.code === 1) {

                        status.innerHTML =
                            "❌ Please allow location permission in Chrome.";

                    }

                    else if (secondError.code === 2) {

                        status.innerHTML =
                            "❌ Location unavailable. Please turn ON Windows Location.";

                    }

                    else if (secondError.code === 3) {

                        status.innerHTML =
                            "❌ Location is taking too long. Please turn ON Windows Location Services.";

                    }

                    else {

                        status.innerHTML =
                            "❌ Unable to detect your location.";

                    }

                },


                {
                    enableHighAccuracy: false,

                    timeout: 30000,

                    maximumAge: 600000
                }

            );

        },


        {
            enableHighAccuracy: false,

            timeout: 30000,

            maximumAge: 600000
        }

    );

}



async function searchHospitals(
    latitude,
    longitude
) {

    const status =
        document.getElementById(
            "hospitalStatus"
        );

    const hospitalList =
        document.getElementById(
            "hospitalList"
        );


    try {

        status.innerHTML =
            "🔍 Finding nearby hospitals...";


        /*
         OpenStreetMap search
        */

        const url =
            "https://nominatim.openstreetmap.org/search" +

            "?format=json" +

            "&q=hospital" +

            "&lat=" +
            encodeURIComponent(latitude) +

            "&lon=" +
            encodeURIComponent(longitude) +

            "&limit=10";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Hospital server error"
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            data.length === 0
        ) {

            status.innerHTML =
                "❌ No nearby hospitals found.";

            return;

        }


        /*
         Distance calculation
        */

        function getDistance(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const R = 6371;


            const dLat =
                (lat2 - lat1) *
                Math.PI / 180;


            const dLon =
                (lon2 - lon1) *
                Math.PI / 180;


            const a =
                Math.sin(dLat / 2) ** 2 +

                Math.cos(
                    lat1 *
                    Math.PI / 180
                ) *

                Math.cos(
                    lat2 *
                    Math.PI / 180
                ) *

                Math.sin(
                    dLon / 2
                ) ** 2;


            const c =
                2 *

                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return R * c;

        }


        /*
         Prepare hospitals
        */

        const hospitals =
            data.map(
                function(item) {


                    const lat =
                        parseFloat(
                            item.lat
                        );


                    const lon =
                        parseFloat(
                            item.lon
                        );


                    return {

                        name:
                            item.display_name
                                .split(",")[0],

                        address:
                            item.display_name,

                        lat:
                            lat,

                        lon:
                            lon,

                        distance:
                            getDistance(
                                latitude,
                                longitude,
                                lat,
                                lon
                            )

                    };

                }
            );


        /*
         Nearest first
        */

        hospitals.sort(
            function(a, b) {

                return (
                    a.distance -
                    b.distance
                );

            }
        );


        /*
         Nearest 5
        */

        const nearest =
            hospitals.slice(0, 5);


        hospitalList.innerHTML = "";


        /*
         Display cards
        */

        nearest.forEach(
            function(hospital) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "hospital-card";


                /*
                 Google Maps Directions
                */

                const mapUrl =

                    "https://www.google.com/maps/dir/?api=1" +

                    "&origin=" +

                    encodeURIComponent(
                        latitude +
                        "," +
                        longitude
                    ) +

                    "&destination=" +

                    encodeURIComponent(
                        hospital.lat +
                        "," +
                        hospital.lon
                    );


                card.innerHTML = `

                    <h2>
                        🏥 ${hospital.name}
                    </h2>

                    <p>
                        📍
                        ${hospital.distance.toFixed(2)}
                        km away
                    </p>

                    <p>
                        🚑 Nearby Hospital
                    </p>

                    <div class="buttons">

                        <a
                            href="${mapUrl}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="map-btn">

                            📍 Directions

                        </a>

                    </div>

                `;


                hospitalList.appendChild(
                    card
                );

            }
        );


        status.innerHTML =
            `✅ Found ${nearest.length} nearby hospitals.`;


    }


    catch(error) {

        console.error(
            "Hospital search error:",
            error
        );


        status.innerHTML =
            "❌ Hospital search is temporarily unavailable. Please try again.";

    }

}


</script>


</body>

</html>
